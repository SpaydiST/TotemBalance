# Шанс выпадения тотема (от 0.0 до 1.0). 0.05 = 1 из 20
drop-chance: 0.05

# Шанс для эвокеров, появившихся в волне рейда. Если параметр отсутствует,
# используется значение drop-chance.
raid-drop-chance: 0.05

# Перезарядка по умолчанию в секундах. 0 сбрасывает активные таймеры;
# переопределения world-cooldowns продолжают действовать.
cooldown-seconds: 60

# Переопределения перезарядки по точному имени мира.
# Для миров без отдельной настройки используется cooldown-seconds.
world-cooldowns:
  # pvp_arena: 120
  # world: 30

messages:
  # %label% заменяется на имя команды
  reload: "&aКонфиг TotemBalance перезагружен."
  usage: "&6Использование: /%label% reload"
  # Сообщение при попытке использовать тотем на перезарядке. %time% = оставшееся время (м:сс). Пустая строка "" = выключено
  cooldown: "&cТотем на перезарядке! Осталось: &6%time%"
